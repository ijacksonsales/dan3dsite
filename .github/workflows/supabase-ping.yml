# Keeps the free-tier Supabase project from pausing (PLAN.md §6, item 9).
# Repository secrets needed: SUPABASE_URL, SUPABASE_ANON_KEY.
name: Supabase ping

on:
  schedule:
    - cron: "17 9 */2 * *" # every 2 days, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Light query to the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/settings?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
